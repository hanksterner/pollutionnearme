name: Generate news RSS feed

on:
  workflow_dispatch:   # allow manual runs
  schedule:
    - cron: '0 * * * *'  # every hour, UTC
  push:
    paths:
      - 'news/*.html'
      - 'scripts/generate_news_feed.py'
      - '.github/workflows/news-feed.yml'

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate news RSS feed
        run: |
          python scripts/generate_news_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ `git status --porcelain` ]]; then
            git add news/feed.xml
            git commit -m "Update news RSS feed"
            git push
          else
            echo "No changes to commit"
          fi
